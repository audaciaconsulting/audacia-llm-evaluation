[project]
name = "audacia-llm-evaluation"
version = "0.2.0"
description = "A framework to evaluate LLMs in AI systems"
authors = [
    { name = "Chris Bentley", email = "chris.bentley@audacia.co.uk" },
    { name = "Alan Kerby", email = "alan.kerby@audacia.co.uk" },
    { name = "Liam Ward", email = "liam.ward@audacia.co.uk" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-evaluation>=1.8.0",
    "azure-ai-projects>=1.0.0b11",
    "huggingface-hub>=0.33.0",
    "langchain-openai>=0.3.24,<1",
    "promptflow>=1.18.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.1.0",
    # ragas imports langchain_community.chat_models.vertexai (removed in
    # langchain-community 0.4) but doesn't pin it. Keep the langchain stack on
    # 0.3 or consumers crash on import. ragas 0.4.x has the same bad import, so
    # don't raise these until it's fixed upstream.
    "ragas>=0.2.15,<0.3",
    "rapidfuzz>=3.13.0",
    "langchain-community>=0.3,<0.4",
    "azure-identity>=1.23.0",
]

[project.optional-dependencies]
# Only the sentiment/toxicity/bias evaluators run a local Hugging Face model.
# They are the sole users of torch + transformers, so those are opt-in here to
# keep the base install small. torch resolves to the CPU-only build (see
# [tool.uv.sources] below) because the evaluators run on device="cpu".
local-models = [
    "torch>=2.7.1",
    "transformers>=4.52.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_eval*"]

# A wheel ships only .py files by default, and PEP 561 tells type checkers to ignore
# a package whose py.typed marker is missing.
[tool.setuptools.package-data]
llm_eval = ["py.typed"]


[tool.pytest.ini_options]
addopts = "-s --log-cli-level=INFO"
log_cli = true
log_cli_level = "INFO"

[tool.uv.sources]
# Pull the CPU-only torch build. The local-model evaluators run on device="cpu",
# so this avoids ~3.4GB of unused CUDA/nvidia wheels on install.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
